media:
  input: public/media
  output: /media

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    view:
      fields: [title, category, pubDate, draft]
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      - name: pubDate
        label: Published date
        type: date
      - name: updatedDate
        label: Updated date
        type: date
        required: false
      - name: category
        label: Section
        type: select
        default: notes
        options:
          values:
            - { name: foreign-affairs, label: "Int'l Affairs" }
            - { name: data, label: Data }
            - { name: notes, label: Notes }
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft (hide until ready)
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
