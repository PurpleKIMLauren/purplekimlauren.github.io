backend:
  name: github
  repo: PurpleKIMLauren/purplekimlauren.github.io
  branch: main
  base_url: REPLACE_WITH_WORKER_URL   # Cloudflare Worker 배포 후 교체

media_folder: public/media
public_folder: /media

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/blog
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: pubDate, label: Published date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { name: updatedDate, label: Updated date, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - name: category
        label: Section
        widget: select
        default: notes
        options:
          - { label: "Int'l Affairs", value: foreign-affairs }
          - { label: Data, value: data }
          - { label: Notes, value: notes }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft (hide until ready), widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }
